<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0e0e0e; --bg-secondary: #141414; --bg-card: #1a1a1a;
    --border: #262626; --border-hover: #3a3a3a;
    --accent-dim: rgba(255,255,255,0.06);

    --white: #ffffff; --nav-height: 64px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Sora', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.7; overflow-x: hidden; min-height: 100vh; }
  body::before { content: ''; position: fixed; inset: 0; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); background-size: 256px; pointer-events: none; z-index: 9999; }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--nav-height); padding: 0 3rem; display: flex; align-items: center; justify-content: space-between; background: rgba(14,14,14,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; text-decoration: none; }

  .nav-links { display: flex; align-items: center; gap: 2.5rem; list-style: none; }

  .nav-links a:hover, .nav-links a.active { color: var(--white); }
  .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--white); transition: width 0.3s ease; }
  .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
  .nav-cta { padding: 0.6rem 1.5rem !important; border: 1px solid var(--text-muted) !important; border-radius: 6px; color: var(--white) !important; font-weight: 500 !important; transition: all 0.3s ease !important; }
  .nav-cta:hover { background: var(--white) !important; color: var(--bg-primary) !important; border-color: var(--white) !important; }
  .nav-cta::after { display: none !important; }

  .page-content { padding-top: var(--nav-height); min-height: calc(100vh - 120px); }
  section { padding: 5rem 3rem; position: relative; }
  .section-label { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1rem; }
  .section-title { font-size: clamp(1.8rem,3.5vw,2.8rem); font-weight: 700; letter-spacing: -0.03em; margin-bottom: 1rem; line-height: 1.15; color: var(--white); }
  .section-desc { color: var(--text-secondary); max-width: 540px; font-size: 1.05rem; margin-bottom: 3.5rem; }

  .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.9rem 2rem; background: var(--white); color: var(--bg-primary); font-family: 'Sora', sans-serif; font-size: 0.9rem; font-weight: 600; text-decoration: none; border-radius: 8px; border: none; cursor: pointer; transition: all 0.3s ease; }

  .btn-secondary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.9rem 2rem; background: transparent; color: var(--text-primary); font-family: 'Sora', sans-serif; font-size: 0.9rem; font-weight: 500; text-decoration: none; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: all 0.3s ease; }

  .hero-actions { display: flex; gap: 1rem; align-items: center; opacity: 0; animation: fadeUp 0.8s ease forwards 0.8s; }

  @media (max-width: 900px) { .hero { padding: 3rem 1.5rem; } .hero-actions { flex-direction: column; align-items: flex-start; } }


  .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; max-width: 1200px; }
  .service-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; transition: all 0.4s ease; position: relative; overflow: hidden; }
  .service-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); opacity: 0; transition: opacity 0.4s ease; }

  .service-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--accent-dim); color: #c8c8c8; margin-bottom: 1.25rem; }
  .service-card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--white); }

  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; max-width: 1100px; align-items: start; }
  .about-text p { color: var(--text-secondary); font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.8; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .stat-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; transition: all 0.3s ease; }
  .stat-box:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  .stat-number { font-size: 2rem; font-weight: 700; color: var(--white); letter-spacing: -0.03em; line-height: 1; margin-bottom: 0.4rem; }

  .prod-tag { display: inline-block; font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0.25rem 0.6rem; margin-bottom: 1.25rem; }
  .divider { border-top: 1px solid var(--border); max-width: 1200px; margin: 0 auto; }
  @media (max-width: 900px) { .shots { grid-template-columns: 1fr; } .prod-card { padding: 1.8rem !important; } }
